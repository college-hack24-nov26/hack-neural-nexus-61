<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky dawn gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A65"/>
      <stop offset="25%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E1" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FFCC80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8A65" stop-opacity="0"/>
    </radialGradient>
    <!-- Field gradient -->
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#AED581"/>
      <stop offset="100%" stop-color="#689F38"/>
    </linearGradient>
  </defs>

  <!-- SKY -->
  <rect width="1440" height="900" fill="url(#sky)"/>
  
  <!-- SUN -->
  <circle cx="1100" cy="180" r="90" fill="#FFF3E0" opacity="0.9"/>
  <circle cx="1100" cy="180" r="140" fill="url(#sun)" opacity="0.6"/>
  
  <!-- Distant hills / Sahyadri -->
  <path d="M0 380 Q 200 320 400 360 Q 600 400 800 340 Q 1000 300 1200 350 Q 1340 380 1440 360 L 1440 420 L 0 420 Z" fill="#A5D6A7" opacity="0.5"/>
  <path d="M0 400 Q 300 360 550 390 Q 800 420 1050 380 Q 1250 350 1440 400 L 1440 450 L 0 450 Z" fill="#81C784" opacity="0.6"/>

  <!-- Mist layer -->
  <rect y="380" width="1440" height="80" fill="white" opacity="0.18"/>

  <!-- Far fields -->
  <path d="M0 450 L 1440 450 L 1440 550 L 0 550 Z" fill="#AED581" opacity="0.7"/>
  <path d="M0 550 L 1440 550 L 1440 650 L 0 650 Z" fill="url(#field2)"/>

  <!-- Crop rows - Indian style -->
  <g stroke="#2E7D32" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="560" x2="1440" y2="560"/>
    <line x1="0" y1="580" x2="1440" y2="580"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="620" x2="1440" y2="620"/>
    <line x1="0" y1="640" x2="1440" y2="640"/>
  </g>

  <!-- Main farm field foreground -->
  <path d="M0 650 Q 720 620 1440 650 L 1440 900 L 0 900 Z" fill="url(#field1)"/>

  <!-- Small Indian hut -->
  <g transform="translate(200,520)">
    <rect x="0" y="30" width="60" height="40" fill="#8D6E63"/>
    <path d="M-10 30 L 30 5 L 70 30 Z" fill="#5D4037"/>
    <rect x="20" y="45" width="15" height="25" fill="#3E2723"/>
  </g>

  <!-- Trees -->
  <g>
    <rect x="350" y="500" width="8" height="40" fill="#5D4037"/>
    <circle cx="354" cy="485" r="25" fill="#388E3C"/>
    <rect x="1150" y="520" width="10" height="50" fill="#5D4037"/>
    <circle cx="1155" cy="505" r="30" fill="#2E7D32"/>
  </g>

  <!-- Farmer silhouette -->
  <g transform="translate(800, 600)" opacity="0.4">
    <circle cx="0" cy="0" r="6" fill="#3E2723"/>
    <line x1="0" y1="6" x2="0" y2="25" stroke="#3E2723" stroke-width="3"/>
    <line x1="-8" y1="12" x2="8" y2="12" stroke="#3E2723" stroke-width="2"/>
    <line x1="0" y1="25" x2="-6" y2="40" stroke="#3E2723" stroke-width="2"/>
    <line x1="0" y1="25" x2="6" y2="40" stroke="#3E2723" stroke-width="2"/>
  </g>

  <!-- Birds -->
  <g fill="none" stroke="#4E342E" stroke-width="1.2" opacity="0.3">
    <path d="M 900 200 Q 905 195 910 200 Q 915 195 920 200"/>
    <path d="M 930 210 Q 935 205 940 210 Q 945 205 950 210"/>
    <path d="M 880 220 Q 885 215 890 220 Q 895 215 900 220"/>
  </g>

  <!-- Light rays -->
  <g opacity="0.07">
    <path d="M 1100 180 L 0 0 L 0 200 Z" fill="#FFCC80"/>
    <path d="M 1100 180 L 0 300 L 0 500 Z" fill="#FFE0B2"/>
  </g>
</svg>